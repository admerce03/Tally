[package]
name = "tally-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "tally_app_lib"

[[bin]]
name = "tally-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde_json.workspace = true
tally-core = { path = "../../core", features = ["schema"] }
tally-store = { path = "../../store" }
tauri = { version = "2", features = [] }
